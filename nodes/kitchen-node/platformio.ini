[platformio]
default_envs = esp32dev

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.15
    bblanchon/ArduinoJson@^7.4.2
    knolleary/PubSubClient@^2.8

[env:esp32dev]
build_flags =
    -D USE_MQTT=0

[env:esp32dev-mqtt]
build_flags =
    -D USE_MQTT=1
